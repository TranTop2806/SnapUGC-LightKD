[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snapugc-lightkd"
version = "0.1.0"
description = "Official SnapUGC teacher reproduction and bounded 5k KD experiment tooling."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<2.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.49.0",
  "sentence-transformers>=2.7",
  "eva-decord>=0.6.1",
  "pillow>=10.0",
  "tqdm>=4.60",
  "accelerate>=0.27",
]

[project.optional-dependencies]
extraction = [
  "tensorflow>=2.14",
  "tensorflow-hub>=0.16",
]
notebook = ["jupyter", "matplotlib"]
analysis = ["scikit-learn>=1.3"]
dev = ["ruff>=0.8.0"]
demo = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "open_clip_torch>=2.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
  "data",
  "results",
  "third_party",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "E501",
]
