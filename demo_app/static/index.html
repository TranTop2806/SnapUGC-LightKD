<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnapUGC LightKD Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel input-panel">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Student-only inference</p>
            <h1>SnapUGC LightKD</h1>
          </div>
          <span class="status-pill" id="health">Ready</span>
        </div>

        <form id="analyze-form" class="form">
          <label class="dropzone" id="dropzone">
            <input id="video" name="video" type="file" accept="video/*" required />
            <span class="drop-icon">↑</span>
            <span class="drop-title">Upload video mới</span>
            <span class="drop-subtitle" id="file-label">MP4, MOV, WebM</span>
          </label>

          <label class="field">
            <span>Title</span>
            <input
              id="title"
              name="title"
              type="text"
              placeholder="VD: Fitness motivation workout"
              autocomplete="off"
            />
          </label>

          <label class="field">
            <span>Description</span>
            <textarea
              id="description"
              name="description"
              rows="4"
              placeholder="Mô tả ngắn nội dung video, optional"
            ></textarea>
          </label>

          <div class="controls">
            <label class="field compact">
              <span>Device</span>
              <select id="device" name="device">
                <option value="cpu">CPU</option>
                <option value="cuda">CUDA</option>
              </select>
            </label>
            <label class="field compact">
              <span>Top clips</span>
              <select id="topk" name="topk">
                <option value="3">3</option>
                <option value="5">5</option>
              </select>
            </label>
          </div>

          <button class="primary" type="submit">
            <span>Analyze</span>
            <span class="arrow">→</span>
          </button>
        </form>
      </section>

      <section class="workspace">
        <div class="preview-band">
          <video id="preview" controls muted playsinline hidden></video>
          <div class="empty-preview" id="empty-preview">Video preview</div>
        </div>

        <section class="result-grid" id="result-grid" hidden>
          <article class="panel score-panel">
            <p class="eyebrow">Engagement prediction</p>
            <div class="score-row">
              <strong id="score">0.000</strong>
              <span id="band">medium</span>
            </div>
            <div class="meter">
              <span id="meter-fill"></span>
            </div>
            <p class="summary" id="summary"></p>
          </article>

          <article class="panel">
            <p class="eyebrow">Faithfulness</p>
            <dl class="metrics">
              <div>
                <dt>Keep-only</dt>
                <dd id="keep-only">-</dd>
              </div>
              <div>
                <dt>Remove</dt>
                <dd id="remove">-</dd>
              </div>
              <div>
                <dt>Confidence</dt>
                <dd id="confidence">-</dd>
              </div>
            </dl>
          </article>
        </section>

        <section class="panel" id="clips-panel" hidden>
          <div class="section-head">
            <div>
              <p class="eyebrow">Evidence</p>
              <h2>Top clips</h2>
            </div>
          </div>
          <div class="clip-list" id="clip-list"></div>
        </section>

        <section class="panel" id="claims-panel" hidden>
          <p class="eyebrow">Explanation</p>
          <ul class="claims" id="claims"></ul>
        </section>

        <section class="panel" id="concepts-panel" hidden>
          <p class="eyebrow">Natural language bottleneck</p>
          <div class="concept-grid" id="concepts"></div>
        </section>

        <section class="panel" id="recommendations-panel" hidden>
          <p class="eyebrow">Actionable suggestions</p>
          <ul class="recommendations" id="recommendations"></ul>
        </section>
      </section>
    </main>

    <div class="toast" id="toast" hidden>
      <span class="spinner"></span>
      <span id="toast-text">Running inference...</span>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
